<?xml version="1.0" encoding="UTF-8"?>
<!--
  Insights card decoration — bottom-right of the Insights panel.
  Place at /public/img/insights-illustration.svg
  Render at ~200x170. Purely decorative: mark aria-hidden="true".
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" fill="none" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- soft background disc -->
  <circle cx="120" cy="96" r="86" fill="#EAF1FD"/>

  <!-- bar chart -->
  <rect x="66"  y="120" width="17" height="34" rx="3" fill="#BFD3F2"/>
  <rect x="89"  y="104" width="17" height="50" rx="3" fill="#9DBEEC"/>
  <rect x="112" y="86"  width="17" height="68" rx="3" fill="#6C9BE0"/>
  <rect x="135" y="66"  width="17" height="88" rx="3" fill="#2563EB"/>
  <line x1="60" y1="156" x2="164" y2="156" stroke="#8FAFDD" stroke-width="2.5" stroke-linecap="round"/>

  <!-- rising arrow -->
  <path d="M64 96 L92 74 L116 88 L156 46" stroke="#1B3B8B" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M140 44 L158 44 L158 62" stroke="#1B3B8B" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- magnifying glass -->
  <circle cx="163" cy="120" r="27" fill="#FFFFFF" fill-opacity=".92" stroke="#1B3B8B" stroke-width="4"/>
  <line x1="182" y1="139" x2="199" y2="156" stroke="#1B3B8B" stroke-width="6" stroke-linecap="round"/>
  <path d="M152 124 l7-8 6 5 9-11" stroke="#2563EB" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

</svg>
