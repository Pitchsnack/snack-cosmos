<?xml version="1.0" encoding="UTF-8"?>
<!--
  Financial Overview — icon sprite
  24x24 viewBox, stroke-based, currentColor. stroke-width 2, round caps/joins.

  Usage:
    <svg class="ico"><use href="/icons/financial-icons.svg#icon-dollar"/></svg>
  or inline this whole file once at the top of the page body and reference:
    <svg class="ico"><use href="#icon-dollar"/></svg>

  Colour is inherited: set `color` on the parent, or `stroke` on the svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ══ KPI CARD ICONS (white glyph on solid coloured circle) ══ -->

  <symbol id="icon-dollar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="1" x2="12" y2="23"/>
