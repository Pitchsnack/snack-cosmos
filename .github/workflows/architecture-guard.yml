name: Architecture Guard

# Read-only static guard for the B5-BLK-5 zero-direct-Supabase ratchet.
# It parses TypeScript with the TypeScript compiler API and reconciles the
# direct @supabase/supabase-js call sites against the frozen allowlist baseline.
# It never contacts Supabase, a database, or the Gateway, uses no secrets, no
# service containers, and performs no deployment.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zero-direct-supabase:
    name: Zero-Direct-Supabase Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run zero-direct-Supabase guard
        run: bun scripts/check-no-direct-supabase.ts

      - name: Run architecture tests
        run: bun run test:arch
